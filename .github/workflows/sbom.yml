name: Snyk SBOM

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snyk-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Generate SBOM — CycloneDX 1.6 JSON
        run: |
          snyk sbom \
            --format=cyclonedx1.6+json \
            --org=${{ secrets.SNYK_ORG_ID }} \
            > sbom-cyclonedx.json

      - name: Generate SBOM — SPDX 2.3 JSON
        run: |
          snyk sbom \
            --format=spdx2.3+json \
            --org=${{ secrets.SNYK_ORG_ID }} \
            > sbom-spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sbom-nodejs-goof
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
